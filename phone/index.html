<!doctype html>
<!-- The phone page: the library on a phone as a list, a grid of box art or
     covers swiped side to side (roadmap AB4), Play on the TV, and while a game
     plays its own page: the manual as a booklet (reader.js), maps, buttons and
     cheats (roadmap BA6, AB2). Served by router-phone.php only, with reader.js
     and the booklet's libraries beside it. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Xsegon</title>
<style>
  :root { --ground: #0b1220; --sheet: #121c30; --rule: #263a5c; --ink: #dbe7f5; --mute: #8fa3bb; --cyan: #5ee0ff; --good: #7ee787; --bad: #ff8f8f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ground); color: var(--ink); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--ground); padding: 10px 12px 8px; border-bottom: 1px solid var(--rule); }
  .top { display: flex; align-items: baseline; gap: 10px; }
  h1 { margin: 0; font-size: 19px; letter-spacing: .18em; color: var(--cyan); }
  #who { color: var(--mute); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .find { display: flex; gap: 8px; margin-top: 8px; }
  input, select, button { font: inherit; color: var(--ink); background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 10px; }
  #q { flex: 1 1 auto; min-width: 0; }
  #console { flex: 0 1 44%; min-width: 0; }
  #now { display: none; margin-top: 8px; padding: 8px 10px; border: 1px solid var(--good); border-radius: 8px; color: var(--good); font-size: 14px; }
  #now.on { display: block; }
  #said { padding: 22px 16px; color: var(--mute); }
  #said.bad { color: var(--bad); }
  #list { list-style: none; margin: 0; padding: 0; }
  #list li { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-bottom: 1px solid var(--rule); min-height: 64px; }
  #list li.cannot .t { color: var(--mute); }
  .art { flex: none; width: 40px; height: 54px; object-fit: contain; background: #000; border-radius: 3px; }
  .t { display: block; }
  .p { display: block; color: var(--mute); font-size: 13px; }
  #more { padding: 18px; text-align: center; color: var(--mute); }

  /* the three looks of your games, chosen at the top and kept on this phone */
  .looks { display: flex; margin-top: 8px; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
  .looks button { flex: 1 1 0; border: 0; border-radius: 0; padding: 7px 4px; font-size: 14px; }
  .looks button + button { border-left: 1px solid var(--rule); }
  .looks button.on { background: var(--cyan); color: var(--ground); font-weight: 700; }
  /* Grid: box art three across (four on a wide phone), the name under each */
  #list.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 10px; padding: 12px; }
  @media (min-width: 560px) { #list.grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  #list.grid li { flex-direction: column; align-items: stretch; gap: 6px; padding: 0; border: 0; min-height: 0; }
  #list.grid .art { width: 100%; height: auto; aspect-ratio: 3 / 4; }
  #list.grid .t { font-size: 13px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #list.grid .p { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Covers: one large in the middle, the next ones swiped in from the sides */
  #covers { padding: 6px 0 4px; }
  #c-row { position: relative; display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; overscroll-behavior-x: contain;
           padding: 14px calc(50% - min(31vw, 170px)); scrollbar-width: none; }
  #c-row::-webkit-scrollbar { display: none; }
  .cover { flex: none; width: min(62vw, 340px); aspect-ratio: 3 / 4; padding: 0; border: 0; border-radius: 6px; overflow: hidden; background: #000;
           scroll-snap-align: center; display: grid; place-items: center; transform: scale(.84); opacity: .55; transition: transform .18s ease-out, opacity .18s; }
  .cover.mid { transform: none; opacity: 1; box-shadow: 0 0 0 2px var(--cyan); }
  .cover img { display: block; width: 100%; height: 100%; object-fit: contain; }
  .cover .none { padding: 14px; color: var(--mute); font-size: 15px; text-align: center; }
  #c-title { margin: 8px 16px 0; font-size: 19px; text-align: center; }
  #c-sub { margin: 2px 16px 0; color: var(--mute); font-size: 14px; text-align: center; font-variant-numeric: tabular-nums; }
  @media (prefers-reduced-motion: reduce) { .cover { transition: none; } }
  /* Wheel, as the TV's: plates (a Clear Logo, or the name) on a curve turning round a point off the right edge,
     the chosen one larger, its box art beside it. The phone's own scroll turns it, so a flick spins and settles. */
  #wheel { position: relative; overflow-y: auto; overscroll-behavior: contain; scroll-snap-type: y mandatory; scrollbar-width: none; }
  #wheel::-webkit-scrollbar { display: none; }
  #w-stage { position: sticky; top: 0; height: var(--wh, 480px); margin-bottom: calc(-1 * var(--wh, 480px)); overflow: hidden; pointer-events: none; z-index: 1; }
  #w-track { padding: calc(var(--wh, 480px) / 2 - var(--ws, 28px) / 2) 0; }
  #w-track div { height: var(--ws, 28px); scroll-snap-align: center; }
  #w-art { position: absolute; left: 3%; top: 44%; width: 44%; aspect-ratio: 3 / 4; object-fit: contain; transform: translateY(-50%); filter: drop-shadow(0 6px 14px rgba(0, 0, 0, .6)); }
  .wp { position: absolute; top: 44%; right: 10px; width: 45%; height: 35px; display: flex; align-items: center; justify-content: center; padding: 3px 8px;
        background: rgba(18, 28, 48, .86); border: 1px solid rgba(94, 224, 255, .3); color: var(--mute); font-size: 12px; letter-spacing: .04em;
        white-space: nowrap; overflow: hidden; transform-origin: calc(50% + 184px) 50%; will-change: transform, opacity;
        clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px)); }
  .wp[hidden] { display: none; }        /* else display: flex keeps a plate that turned away, faint where it left */
  .wp img { display: block; max-height: 26px; max-width: 100%; object-fit: contain; }
  .wp .t { overflow: hidden; text-overflow: ellipsis; }
  .wp.sel { width: 50%; height: 50px; color: var(--ink); border-color: var(--cyan); background: rgba(18, 28, 48, .96); font-size: 14px; }
  .wp.sel img { max-height: 38px; }
  #w-cap { position: absolute; left: 0; right: 0; bottom: 10px; padding: 0 12px; text-align: center; }
  #w-title { margin: 0; font-size: 18px; }
  #w-sub { margin: 2px 0 0; color: var(--mute); font-size: 14px; font-variant-numeric: tabular-nums; }
  #sheet, #dsheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; display: none; background: var(--sheet); border-top: 1px solid var(--cyan);
           padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }
  #sheet.on, #dsheet.on { display: block; }
  #disc { margin-left: auto; flex: none; padding: 6px 10px; font-size: 14px; }
  #again { margin: 0 16px; }
  #d-title { font-size: 18px; margin: 0 0 6px; }
  #d-sub { color: var(--mute); margin: 0 0 12px; font-size: 14px; }
  #d-said { min-height: 1.4em; margin: 10px 0 0; font-size: 14px; color: var(--bad); }
  #s-title { font-size: 18px; margin: 0 0 2px; }
  #s-sub { color: var(--mute); margin: 0 0 12px; font-size: 14px; }
  #s-said { min-height: 1.4em; margin: 10px 0 0; font-size: 14px; color: var(--mute); }
  #s-said.bad { color: var(--bad); }
  #s-said.good { color: var(--good); }
  .row { display: flex; gap: 10px; }
  #s-play, #d-yes { flex: 1 1 auto; background: var(--cyan); color: var(--ground); border-color: var(--cyan); font-weight: 700; padding: 14px; }
  #s-play:disabled, #d-yes:disabled { opacity: .45; }
  #s-shut, #d-no { flex: none; padding: 14px 18px; }

  /* the playing game's page: the list steps aside while it is open */
  #game { display: none; padding: 10px 12px 18px; }
  body.in-game #game { display: block; }
  body.in-game #find, body.in-game #looks, body.in-game #list, body.in-game #covers, body.in-game #wheel, body.in-game #more, body.in-game #said { display: none !important; }
  #now.go { cursor: pointer; }
  #now.go::after { content: " \203A"; }
  .g-top { display: flex; align-items: center; gap: 10px; }
  #g-back { flex: none; padding: 8px 12px; }
  #g-title { margin: 0; font-size: 18px; }
  #g-sub { margin: 0; color: var(--mute); font-size: 13px; }
  #g-tabs { display: flex; gap: 6px; margin: 12px 0 10px; }
  #g-tabs button { flex: 1 1 0; min-width: 0; padding: 9px 4px; font-size: 14px; }
  #g-tabs button.on { background: var(--cyan); color: var(--ground); border-color: var(--cyan); font-weight: 700; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .chips button { padding: 6px 10px; font-size: 14px; }
  .chips button.on { border-color: var(--cyan); color: var(--cyan); }
  .bk-stage { display: flex; align-items: center; justify-content: center; }
  .bk-book { position: relative; flex: none; }
  .bk-book .stf__wrapper { height: 100%; }
  .bk-page { background: #f2eee4; overflow: hidden; }
  .bk-page canvas { display: block; width: 100%; height: 100%; }
  .bk-num { display: grid; place-items: center; height: 100%; color: #8e8677; font-size: 28px; }
  .bk-hot { position: absolute; top: 0; bottom: 0; z-index: 1000; }
  .bk-hot.prev { left: 0; width: 35%; }
  .bk-hot.next { right: 0; width: 65%; }
  .bk-foot { display: flex; align-items: center; gap: 12px; padding-top: 10px; }
  .bk-folio { flex: none; min-width: 7.5em; color: var(--mute); font-size: 14px; font-variant-numeric: tabular-nums; }
  .bk-scrub { flex: 1 1 auto; min-width: 0; padding: 0; border: 0; background: none; accent-color: var(--cyan); }
  .bk-wait, .bk-fail { padding: 24px 4px; color: var(--mute); }
  .bk-fail { color: var(--bad); }
  .bk-fail a { color: var(--cyan); }
  .maps figure { margin: 0 0 14px; }
  .maps img { display: block; width: 100%; height: auto; background: #000; border-radius: 4px; }
  .maps figcaption { padding-top: 4px; color: var(--mute); font-size: 13px; }
  .g-sec h3 { margin: 14px 0 6px; color: var(--cyan); font-size: 14px; letter-spacing: .04em; }
  .pair { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--rule); font-size: 14px; }
  .pair span:last-child { color: var(--mute); text-align: right; }
  .g-list { margin: 0; padding-left: 18px; }
  .g-list li { padding: 4px 0; }
  .hint { margin: 12px 0 0; color: var(--mute); font-size: 13px; }
</style>
</head>
<body>
<header>
  <div class="top"><h1>XSEGON</h1><span id="who"></span><button id="disc" type="button" hidden>Disconnect</button></div>
  <div class="find" id="find" hidden>
    <input id="q" type="search" placeholder="Search your games" autocomplete="off" spellcheck="false">
    <select id="console" aria-label="Console"><option value="">All consoles</option></select>
  </div>
  <div class="looks" id="looks" role="tablist" aria-label="How your games are shown" hidden>
    <button type="button" role="tab" data-look="list">List</button><button type="button" role="tab" data-look="grid">Grid</button><button type="button" role="tab" data-look="covers">Covers</button><button type="button" role="tab" data-look="wheel">Wheel</button>
  </div>
  <div id="now"></div>
</header>
<p id="said">Asking the PC...</p>
<button id="again" type="button" hidden>Open it again</button>
<ul id="list"></ul>
<div id="covers" hidden><div id="c-row"></div><p id="c-title"></p><p id="c-sub"></p></div>
<div id="wheel" hidden>
  <div id="w-stage"><img id="w-art" alt="" hidden><div id="w-plates"></div><div id="w-cap"><p id="w-title"></p><p id="w-sub"></p></div></div>
  <div id="w-track"></div>
</div>
<div id="more" hidden></div>
<section id="game" aria-labelledby="g-title">
  <div class="g-top"><button id="g-back" type="button">&#8249; Library</button><div><p id="g-title"></p><p id="g-sub"></p></div></div>
  <div id="g-tabs" role="tablist"></div>
  <div id="g-body"></div>
</section>
<div id="sheet">
  <p id="s-title"></p>
  <p id="s-sub"></p>
  <div class="row"><button id="s-play" type="button">Play on the TV</button><button id="s-shut" type="button">Close</button></div>
  <p id="s-said"></p>
</div>
<div id="dsheet" role="dialog" aria-labelledby="d-title">
  <p id="d-title" class="t">Switch the phone page off?</p>
  <p id="d-sub">The PC stops answering phones until it is switched on again in Xsegon's Connect a phone... window. This phone stays let in: no square to scan next time.</p>
  <div class="row"><button id="d-yes" type="button">Switch off</button><button id="d-no" type="button">Cancel</button></div>
  <p id="d-said"></p>
</div>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var LOT = 200, games = [], total = 0, asked = 0, chosen = null, busy = false, consolesIn = false, timer = 0;
  var LOOKS = ["list", "grid", "covers", "wheel"], look = "list", mid = -1, raf = 0;
  var STEP = 28, ARC = 9, GAP = 3, plates = [], wsel = -1, wraf = 0, bigT = 0;     // the Wheel: px of swipe a game, degrees a plate
  var audio = null, tick = null, tickAt = 0;                                         // the Wheel's click: the PC's Move sound
  try { look = localStorage.getItem("xsLook") || "list"; } catch (e) { /* nothing kept on this phone: List */ }
  if (LOOKS.indexOf(look) < 0) { look = "list"; }

  // Every question to the PC: the cookie goes by itself, and the header says this page sent it.
  function ask(path, body) {
    var opts = { credentials: "same-origin", cache: "no-store", headers: { "X-Xsegon-Phone": "1" } };
    if (body) { opts.method = "POST"; opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
    return fetch(path, opts).then(function (r) {
      return r.json().then(function (a) { a.status = r.status; return a; }, function () { return { ok: false, status: r.status, error: "the PC answered with something that is not Xsegon's" }; });
    }, function () { return { ok: false, status: 0, error: "The PC is not answering. Is Xsegon open, and is this phone on the home Wi-Fi?" }; });
  }
  function say(words, bad) { $("said").textContent = words; $("said").className = bad ? "bad" : ""; $("said").hidden = !words; }

  function row(g) {
    var li = document.createElement("li"), words = document.createElement("div"), t = document.createElement("span"), p = document.createElement("span");
    if (g.hasArt) {
      var img = document.createElement("img");
      img.className = "art"; img.alt = ""; img.loading = "lazy"; img.decoding = "async";
      img.src = "/p/art?id=" + encodeURIComponent(g.id);
      img.onerror = function () { img.style.visibility = "hidden"; };
      li.appendChild(img);
    } else {
      var gap = document.createElement("span"); gap.className = "art"; li.appendChild(gap);
    }
    t.className = "t"; t.textContent = g.title;
    p.className = "p"; p.textContent = g.platform;
    words.appendChild(t); words.appendChild(p);
    li.appendChild(words);
    if (!g.playable) { li.className = "cannot"; }
    li.addEventListener("click", function () { open(g); });
    return li;
  }

  function load(fresh) {
    if (busy) { return; }
    busy = true;
    var mine = ++asked, from = fresh ? 0 : games.length;
    ask("/p/list?q=" + encodeURIComponent($("q").value.trim()) + "&platform=" + encodeURIComponent($("console").value) + "&from=" + from).then(function (a) {
      if (mine !== asked) { return; }           // a newer ask is out: it lets go of busy, not this one
      busy = false;
      if (a.status === 401) { notIn(a.error); return; }
      if (!a.ok) { say(a.error || "The list could not be read.", true); return; }
      if (fresh) { games = []; clearLooks(); window.scrollTo(0, 0); }
      total = a.count;
      a.games.forEach(function (g) { games.push(g); add(g); });
      if (!consolesIn && a.consoles.length) {
        consolesIn = true;
        a.consoles.forEach(function (c) { var o = document.createElement("option"); o.value = c.name; o.textContent = c.name + " (" + c.count + ")"; $("console").appendChild(o); });
      }
      say(total ? "" : "No game matches that.", false);
      more();
      settle();
    });
  }
  function more() {
    $("more").hidden = look === "wheel" || games.length >= total;      // the Wheel asks for more as it nears its end
    $("more").textContent = games.length + " of " + total + " shown: " + (look === "covers" ? "swipe on for more" : "scroll for more");
  }

  /* ---- the four looks: List, Grid (the list's rows as box art three across), Covers, Wheel ---- */

  function setLook(v) {
    look = v;
    try { localStorage.setItem("xsLook", v); } catch (e) { /* kept for this visit only */ }
    [].forEach.call($("looks").children, function (b) { var on = b.dataset.look === v; b.className = on ? "on" : ""; b.setAttribute("aria-selected", on ? "true" : "false"); });
    $("list").className = v === "grid" ? "grid" : "";
    $("list").hidden = v === "covers" || v === "wheel";
    $("covers").hidden = v !== "covers";
    $("wheel").hidden = v !== "wheel";
    clearLooks();
    if (v === "wheel") { wheelSize(); }
    games.forEach(add);
    settle();
    more();
  }
  function clearLooks() {
    $("list").textContent = ""; $("c-row").textContent = ""; $("c-row").scrollLeft = 0; mid = -1;
    $("w-plates").textContent = ""; $("w-track").textContent = ""; $("wheel").scrollTop = 0; plates = []; wsel = -1;
  }
  // One game into the look in sight.
  function add(g) {
    if (look === "covers") { $("c-row").appendChild(cover(g)); }
    else if (look === "wheel") { var p = plate(g); plates.push(p); $("w-plates").appendChild(p); $("w-track").appendChild(document.createElement("div")); }
    else { $("list").appendChild(row(g)); }
  }
  function settle() { if (look === "covers") { centre(); } else if (look === "wheel") { spin(); } }

  // The Wheel takes the screen under the top bar; each game is a stretch of swipe, so the phone's own scroll turns it.
  function wheelSize() {
    var h = Math.max(300, window.innerHeight - document.querySelector("header").offsetHeight);
    $("wheel").style.height = h + "px";
    $("wheel").style.setProperty("--wh", h + "px");
    $("wheel").style.setProperty("--ws", STEP + "px");
  }
  // The TV wheel's click, the PC's own Move sound. A phone lets a page sound only after a touch, so it wakes at one.
  function wake() {
    if (look !== "wheel") { return; }
    if (audio) { if (audio.state === "suspended") { audio.resume(); } return; }
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { return; }
    audio = new AC();
    fetch("/p/sound", { credentials: "same-origin", headers: { "X-Xsegon-Phone": "1" } }).then(function (r) { return r.status === 200 ? r.arrayBuffer() : null; }).then(function (b) {
      if (b) { audio.decodeAudioData(b, function (d) { tick = d; }, function () { /* a sound the phone cannot play: silent */ }); }
    }, function () { /* no answer: silent */ });
  }
  // At most one a frame and a half, so a fast fling ticks like a wheel instead of buzzing.
  function click() {
    var t = Date.now();
    if (!tick || audio.state !== "running" || t - tickAt < 25) { return; }
    tickAt = t;
    var s = audio.createBufferSource(), v = audio.createGain();
    v.gain.value = 0.6;
    s.buffer = tick; s.connect(v); v.connect(audio.destination); s.start();
  }
  function plate(g) {
    var n = document.createElement("div"), t = document.createElement("span");
    n.className = "wp"; n.hidden = true;
    t.className = "t"; t.textContent = g.title;
    n.appendChild(t);
    return n;
  }
  // A plate's Clear Logo, asked for the first time it turns near: the name stays until it has come.
  function logo(n, g) {
    n.logoAsked = true;
    if (!g.hasLogo) { return; }
    var img = document.createElement("img"), t = n.firstChild;
    img.alt = g.title; img.decoding = "async";
    img.onload = function () { if (t.parentNode) { t.remove(); } };
    img.onerror = function () { img.remove(); };
    img.src = "/p/art?id=" + encodeURIComponent(g.id) + "&kind=logo";
    n.appendChild(img);
  }
  function spin() {
    wraf = 0;
    if (!plates.length) { $("w-title").textContent = ""; $("w-sub").textContent = ""; $("w-art").hidden = true; return; }
    var f = $("wheel").scrollTop / STEP, near = Math.max(0, Math.min(plates.length - 1, Math.round(f)));
    for (var i = 0; i < plates.length; i++) {
      var n = plates[i], d = i - f;
      if (Math.abs(d) >= 6) { if (!n.hidden) { n.hidden = true; } continue; }
      if (n.hidden) { n.hidden = false; if (!n.logoAsked) { logo(n, games[i]); } }
      // Minus turns later games downward round the pivot off the right edge, as the TV's wheel hangs; the chosen one's neighbours stand a little further off.
      n.style.transform = "translateY(-50%) rotate(" + (d * -ARC - Math.max(-1, Math.min(1, d)) * GAP).toFixed(2) + "deg)";
      n.style.opacity = String(Math.max(0, 1 - Math.abs(d) / 6).toFixed(3));        // gone by the time it is hidden
      n.style.zIndex = String(100 - Math.round(Math.abs(d) * 10));
      n.classList.toggle("sel", i === near);
    }
    if (near !== wsel) { if (wsel >= 0) { click(); } wsel = near; wheelChose(near); }
  }
  // The chosen game: named under the wheel, its box beside it (sharp once the wheel rests), more asked for near the end.
  function wheelChose(i) {
    var g = games[i], art = $("w-art");
    $("w-title").textContent = g.title;
    $("w-sub").textContent = g.platform + " · " + (i + 1) + " of " + total;
    art.hidden = !g.hasArt;
    clearTimeout(bigT);
    if (g.hasArt) {
      var want = "/p/art?id=" + encodeURIComponent(g.id);
      art.dataset.id = g.id;
      art.src = want;
      bigT = setTimeout(function () {
        var big = new Image();
        big.onload = function () { if (art.dataset.id === g.id) { art.src = big.src; } };
        big.src = want + "&big=1";
      }, 250);
    }
    if (i > plates.length - 8 && games.length < total) { load(false); }
  }
  // A tap: on the chosen plate or its box, its sheet; on another plate, the wheel turns to it.
  function wheelTap(e) {
    var order = [wsel];
    for (var k = 1; k <= 8; k++) { order.push(wsel - k, wsel + k); }
    for (var j = 0; j < order.length; j++) {
      var i = order[j], n = plates[i];
      if (!n || n.hidden) { continue; }
      var r = n.getBoundingClientRect();
      if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) {
        if (i === wsel) { open(games[i]); } else { $("wheel").scrollTo({ top: i * STEP, behavior: "smooth" }); }
        return;
      }
    }
    var a = $("w-art").getBoundingClientRect();
    if (wsel >= 0 && !$("w-art").hidden && e.clientX >= a.left && e.clientX <= a.right && e.clientY >= a.top && e.clientY <= a.bottom) { open(games[wsel]); }
  }
  function cover(g) {
    var c = document.createElement("button");
    c.type = "button"; c.className = "cover"; c.setAttribute("aria-label", g.title + ", " + g.platform);
    var none = function () { c.textContent = ""; var s = document.createElement("span"); s.className = "none"; s.textContent = g.title; c.appendChild(s); };
    if (g.hasArt) {
      var img = document.createElement("img");
      img.alt = ""; img.loading = "lazy"; img.decoding = "async";
      img.src = "/p/art?id=" + encodeURIComponent(g.id);
      img.onerror = none;
      c.appendChild(img);
    } else { none(); }
    // The one in the middle opens its sheet; one beside it comes to the middle first.
    c.addEventListener("click", function () {
      if (c.classList.contains("mid")) { open(g); } else { c.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" }); }
    });
    return c;
  }
  // Which cover is in the middle: lit, named under the row, drawn at its own size, and more asked for near the end.
  function centre() {
    raf = 0;
    var r = $("c-row"), kids = r.children;
    if (!kids.length) { $("c-title").textContent = ""; $("c-sub").textContent = ""; return; }
    var step = kids.length > 1 ? kids[1].offsetLeft - kids[0].offsetLeft : 1;
    var i = Math.round((r.scrollLeft + r.clientWidth / 2 - kids[0].offsetLeft - kids[0].offsetWidth / 2) / step);
    i = Math.max(0, Math.min(kids.length - 1, i));
    if (i === mid) { return; }
    if (kids[mid]) { kids[mid].classList.remove("mid"); }
    mid = i;
    var c = kids[i], g = games[i], img = c.querySelector("img");
    c.classList.add("mid");
    $("c-title").textContent = g.title;
    $("c-sub").textContent = g.platform + " · " + (i + 1) + " of " + total;
    if (img && !img.dataset.big) {
      img.dataset.big = "1";
      var big = new Image();
      big.onload = function () { img.src = big.src; };
      big.src = "/p/art?id=" + encodeURIComponent(g.id) + "&big=1";
    }
    if (i > kids.length - 8 && games.length < total) { load(false); }
  }

  function open(g) {
    chosen = g;
    $("s-title").textContent = g.title;
    $("s-sub").textContent = g.platform;
    $("s-play").disabled = !g.playable;
    $("s-said").className = "";
    $("s-said").textContent = g.playable ? "" : "This one cannot start on the PC as it stands. Xsegon on the TV says why.";
    $("sheet").className = "on";
  }
  function shut() { chosen = null; $("sheet").className = ""; }

  function play() {
    if (!chosen) { return; }
    var g = chosen;
    $("s-play").disabled = true;
    $("s-said").className = ""; $("s-said").textContent = "Asking the PC to start it...";
    ask("/p/play", { id: g.id }).then(function (a) {
      if (chosen !== g) { return; }
      $("s-play").disabled = false;
      if (a.status === 401) { shut(); notIn(a.error); return; }
      $("s-said").className = a.ok ? "good" : "bad";
      $("s-said").textContent = a.ok ? "Starting on the TV." : (a.error || "It did not start.");
      if (a.ok) { setTimeout(now, 3000); }
    });
  }

  /* What plays on the TV, asked while this page is in sight. A game that has
     just started opens its page by itself, once: put away, it stays away until
     another starts. Its page goes when the game ends. */
  var nowId = "", lastRun = "";
  function now() {
    if (document.hidden) { return; }
    ask("/p/now").then(function (a) {
      var r = a.ok && a.running, rid = r ? r.id : "";
      nowId = rid;
      $("now").className = r ? "on" + (rid ? " go" : "") : "";
      $("now").textContent = r ? "Playing on the TV: " + r.title : "";
      if (look === "wheel" && !$("wheel").hidden) { wheelSize(); }     // the line takes height from under the bar
      if (rid && rid !== lastRun && (!game || game.id !== rid)) { openGame(rid); }
      if (!rid && lastRun && game && game.id === lastRun) { closeGame(); }
      lastRun = rid;
    });
  }

  /* ---- the playing game's page: its manual, maps, buttons and cheats ---------- */

  var game = null, book = null, gameAsked = 0, tabAsked = 0, listAt = 0;
  function openGame(id) {
    var mine = ++gameAsked;
    shut();
    ask("/p/game?id=" + encodeURIComponent(id)).then(function (a) {
      if (mine !== gameAsked) { return; }
      if (a.status === 401) { notIn(a.error); return; }
      if (!a.ok) { return; }                    // the list stays; the line above still says what plays
      if (!game) { listAt = window.scrollY; }
      game = a;
      $("g-title").textContent = a.title;
      $("g-sub").textContent = a.platform;
      var pdfs = a.docs.filter(function (d) { return d.kind === "pdf"; }), pics = a.docs.filter(function (d) { return d.kind === "image"; });
      var tabs = [];
      if (pdfs.length) { tabs.push(["manual", pdfs.length > 1 ? "Manuals" : "Manual"]); }
      if (pics.length) { tabs.push(["maps", "Maps"]); }
      tabs.push(["buttons", "Buttons"], ["cheats", "Cheats"]);
      $("g-tabs").textContent = "";
      tabs.forEach(function (t) {
        var b = document.createElement("button");
        b.type = "button"; b.dataset.tab = t[0]; b.textContent = t[1]; b.setAttribute("role", "tab");
        b.addEventListener("click", function () { tab(t[0]); });
        $("g-tabs").appendChild(b);
      });
      document.body.classList.add("in-game");
      window.scrollTo(0, 0);
      tab(tabs[0][0]);
    });
  }
  function closeGame() {
    gameAsked++; tabAsked++;
    if (book) { book.close(); book = null; }
    game = null;
    $("g-body").textContent = "";
    document.body.classList.remove("in-game");
    window.scrollTo(0, listAt);
  }
  function tab(name) {
    var mine = ++tabAsked, body = $("g-body");
    [].forEach.call($("g-tabs").children, function (b) { var on = b.dataset.tab === name; b.className = on ? "on" : ""; b.setAttribute("aria-selected", on ? "true" : "false"); });
    if (book) { book.close(); book = null; }
    body.textContent = "";
    body.dataset.tab = name;
    if (name === "manual") { manual(body, game.docs.filter(function (d) { return d.kind === "pdf"; }), 0, mine); }
    else if (name === "maps") { maps(body); }
    else { ask("/p/" + name + "?id=" + encodeURIComponent(game.id)).then(function (a) { if (mine === tabAsked) { (name === "buttons" ? buttons : cheats)(body, a); } }); }
  }
  function line(parent, tag, cls, words) { var n = document.createElement(tag); if (cls) { n.className = cls; } n.textContent = words; parent.appendChild(n); return n; }
  function pair(parent, a, b) { var r = line(parent, "div", "pair", ""); line(r, "span", null, a); line(r, "span", null, b); }

  function manual(body, pdfs, which, mine) {
    body.textContent = "";
    if (pdfs.length > 1) {
      var chips = line(body, "div", "chips", "");
      pdfs.forEach(function (d, k) {
        var c = line(chips, "button", k === which ? "on" : "", d.label);
        c.type = "button";
        c.addEventListener("click", function () { if (book) { book.close(); book = null; } manual(body, pdfs, k, mine); });
      });
    }
    var box = line(body, "div", "bk", ""), d = pdfs[which];
    import("/reader.js").then(function (m) {
      if (mine !== tabAsked || !box.isConnected) { return; }
      // The booklet takes the room left under the tabs, with its page number and slider under it.
      book = m.openBook(box, d, function (page) { d.page = page; ask("/p/place", { id: game.id, doc: d.file, page: page }); });
      var stage = box.querySelector(".bk-stage");
      if (stage) { stage.style.height = Math.max(260, window.innerHeight - stage.getBoundingClientRect().top - 110) + "px"; }
    }, function () { line(body, "p", "bk-fail", "The booklet could not be loaded on this phone."); });
  }
  function maps(body) {
    var box = line(body, "div", "maps", "");
    game.docs.filter(function (d) { return d.kind === "image"; }).forEach(function (d) {
      var f = line(box, "figure", null, ""), img = document.createElement("img");
      img.src = d.url; img.alt = d.label; img.loading = "lazy"; img.decoding = "async";
      f.appendChild(img);
      line(f, "figcaption", null, d.label);
    });
    line(body, "p", "hint", "Pinch to make a map larger.");
  }
  function buttons(body, a) {
    if (!a.ok) { line(body, "p", "bk-fail", a.error || "The buttons could not be read."); return; }
    var sec = line(body, "div", "g-sec", ""), said = false;
    if (a.swaps.length) {
      line(sec, "h3", null, "This game's own buttons");
      a.swaps.forEach(function (s) { pair(sec, s.from, "acts as " + s.to); });
      said = true;
    } else if (a.standard) {
      line(sec, "p", "hint", "This game's buttons are as they come.");
    }
    if (a.hotkeys.length) {
      line(sec, "h3", null, "Leaving, pausing and saving");
      a.hotkeys.forEach(function (h) { pair(sec, h.name, h.press); });
      said = true;
    }
    if (a.rows.length) {
      line(sec, "h3", null, a.via ? a.via + "'s own buttons" : "The emulator's own buttons");
      a.rows.forEach(function (r) { pair(sec, r.name, r.value); });
      said = true;
    }
    if (!said) { line(sec, "p", null, a.note || "Xsegon has nothing to say about this game's buttons."); }
    line(body, "p", "hint", "What each button does in the game is in its manual.");
  }
  function cheats(body, a) {
    if (!a.ok) { line(body, "p", "bk-fail", a.error || "The cheats could not be read."); return; }
    if (a.on.length) {
      var sec = line(body, "div", "g-sec", "");
      line(sec, "h3", null, "On for this game");
      var ul = line(sec, "ul", "g-list", "");
      a.on.forEach(function (w) { line(ul, "li", null, w); });
    } else {
      line(body, "p", null, a.why || "No cheats are on for this game.");
    }
    line(body, "p", "hint", "Cheats are chosen in the game's Cheats tab on the TV, and put on as the game starts.");
  }

  /* Disconnect: the phone page switched off from here, at any moment, a game playing or not. Asked
     once, since coming back takes a press on the TV; this phone stays let in. */
  function askOff() { shut(); $("d-said").textContent = ""; $("d-yes").disabled = false; $("dsheet").className = "on"; }
  function off() {
    $("d-yes").disabled = true;
    $("d-said").textContent = "";
    ask("/p/off", {}).then(function (a) {
      $("d-yes").disabled = false;
      if (a.status === 401) { $("dsheet").className = ""; notIn(a.error); return; }
      if (!a.ok) { $("d-said").textContent = a.error || "The PC did not switch it off."; return; }
      $("dsheet").className = "";
      clearInterval(timer);
      if (game) { closeGame(); }
      $("find").hidden = true; $("looks").hidden = true; $("covers").hidden = true; $("wheel").hidden = true; $("list").textContent = ""; $("more").hidden = true; $("disc").hidden = true; $("now").className = "";
      say("Disconnected: the phone page is switched off on the PC. To come back, choose Switch on in Xsegon's Connect a phone... window on the TV, then Open it again here.", false);
      $("again").hidden = false;
    });
  }

  function notIn(why) {
    clearInterval(timer);
    if (game) { closeGame(); }
    $("disc").hidden = true;
    $("find").hidden = true; $("looks").hidden = true; $("covers").hidden = true; $("wheel").hidden = true; $("list").textContent = ""; $("more").hidden = true; $("who").textContent = "";
    say(why || "This phone has not been let in. On the TV, open the round X's menu, then Connect a phone..., and point this phone's camera at the square.", true);
  }
  function start(name) {
    $("who").textContent = name;
    $("find").hidden = false;
    $("disc").hidden = false;
    $("looks").hidden = false;
    setLook(look);
    load(true);
    now();
    timer = setInterval(now, 5000);
  }

  var wait = 0;
  $("q").addEventListener("input", function () { clearTimeout(wait); wait = setTimeout(function () { busy = false; load(true); }, 300); });
  $("console").addEventListener("change", function () { busy = false; load(true); });
  $("s-play").addEventListener("click", play);
  $("s-shut").addEventListener("click", shut);
  $("g-back").addEventListener("click", closeGame);
  $("disc").addEventListener("click", askOff);
  $("d-yes").addEventListener("click", off);
  $("d-no").addEventListener("click", function () { $("dsheet").className = ""; });
  $("again").addEventListener("click", function () { location.reload(); });
  $("now").addEventListener("click", function () { if (nowId && (!game || game.id !== nowId)) { openGame(nowId); } });
  window.addEventListener("scroll", function () {
    if (look !== "covers" && !$("more").hidden && window.innerHeight + window.scrollY > document.body.offsetHeight - 900) { load(false); }
  }, { passive: true });
  $("c-row").addEventListener("scroll", function () { if (!raf) { raf = requestAnimationFrame(centre); } }, { passive: true });
  $("wheel").addEventListener("scroll", function () { if (!wraf) { wraf = requestAnimationFrame(spin); } }, { passive: true });
  $("wheel").addEventListener("click", wheelTap);
  ["touchend", "click"].forEach(function (k) { document.addEventListener(k, wake, { passive: true }); });
  window.addEventListener("resize", function () { if (look === "wheel" && !$("wheel").hidden) { wheelSize(); spin(); } });
  [].forEach.call($("looks").children, function (b) { b.addEventListener("click", function () { if (b.dataset.look !== look) { setLook(b.dataset.look); } }); });
  document.addEventListener("visibilitychange", function () { if (!document.hidden && !$("find").hidden) { now(); } });

  // A link from the square carries a code: it is handed in once, and taken out of the address so a bookmark is clean.
  var code = (/[?&]c=([0-9a-f]{16})(?:&|$)/.exec(location.search) || [])[1];
  if (location.search) { try { history.replaceState(null, "", "/"); } catch (e) { /* the address stays as it is */ } }
  (code ? ask("/p/join", { code: code }) : Promise.resolve(null)).then(function (joined) {
    ask("/p/me").then(function (me) {
      if (me.ok) { start(me.name); return; }
      notIn(me.status === 401 ? (joined && !joined.ok && joined.error ? joined.error : me.error) : me.error);
    });
  });
}());
</script>
</body>
</html>
